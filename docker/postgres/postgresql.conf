# PostgreSQL 18 tuned for a short-transaction OLTP API on one machine.
# Sizes assume ~4 GB available to the container; scale with the hardware.

listen_addresses = '*'
max_connections = 200			# a few pipelined connections per API worker
password_encryption = scram-sha-256

# Memory
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB
huge_pages = try

# Asynchronous I/O (new in 18): io_uring needs the seccomp profile in compose.
io_method = io_uring
effective_io_concurrency = 64
maintenance_io_concurrency = 64

# WAL and durability. synchronous_commit stays on: a 201 means the row
# survives a crash. Turning it off is a benchmark-only trade-off that can
# lose the last few hundred ms of acknowledged writes on a crash.
synchronous_commit = on
wal_compression = lz4
wal_buffers = 64MB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Planner: data lives on SSD and fits in memory.
random_page_cost = 1.1
jit = off				# JIT only adds latency to short queries

# Autovacuum keeps up with update/delete-heavy CRUD traffic.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Observability
log_min_duration_statement = 250ms
log_checkpoints = on
log_lock_waits = on
track_io_timing = on
